version: '3.8'

services:
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fastapi:secret@postgres:5432/fastapi_dev
    restart: unless-stopped

  data_service:
    build: ./data_service
    container_name: data_service
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fastapi:secret@postgres:5432/fastapi_dev
    restart: unless-stopped

  route_service:
    build: ./route_service
    container_name: route_service
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fastapi:secret@postgres:5432/fastapi_dev
    restart: unless-stopped

  station_service:
    build: ./station_service
    container_name: station_service
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_KEY: 0693cf5e-35eb-460b-acb3-585ca9dd2547
      DATABASE_URL: postgresql+asyncpg://fastapi:secret@postgres:5432/fastapi_dev
    restart: unless-stopped

  user_service:
    build: ./user_service
    container_name: user_service
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET_KEY: Bc-1ZXSm_MehZgkiDSRm70sLZHCM5wlgTQegWqg3LsbOK5sd2cc4KHGc0dNqY5egfMLm2YYo5vnl1m3uMMxB8w==
      DATABASE_URL: postgresql+asyncpg://fastapi:secret@postgres:5432/fastapi_dev
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: fastapi
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fastapi_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi -d fastapi_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  